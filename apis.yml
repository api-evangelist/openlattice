name: OpenLattice
description: >-
  OpenLattice was a data-integration and analytics platform built around an Entity
  Data Model (EDM) — a graph of entity types, property types, association types, and
  EntitySets — with a fine-grained ACL permissions model over organizations, roles,
  and principals. It was adopted by public-sector and criminal-justice programs such
  as reentry case management, community work programs, childcare, and courts. The
  company's hosted service and website (openlattice.com, api.openlattice.com) no
  longer resolve, but its OpenAPI 3.0 specification (91 operations), multi-language
  SDKs, and React UI kit remain published under the github.com/openlattice
  organization, from which this profile was enriched.
