  helper libraries to npm under the openlattice org, and auto-generated REST
  clients (from openlattice.yaml) for six languages in the api-clients repo. The
  company's domains no longer resolve, but the packages remain published. Only
  packages whose repository resolves to github.com/openlattice are marked official.
